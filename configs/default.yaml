# Default configuration for bankruptcy prediction models

data:
  n_samples: 1000
  test_size: 0.2
  random_state: 42
  data_path: null

models:
  logistic_regression:
    random_state: 42
    max_iter: 1000
    C: 1.0
    penalty: l2
    solver: liblinear
  
  random_forest:
    n_estimators: 100
    max_depth: null
    min_samples_split: 2
    min_samples_leaf: 1
    random_state: 42
    class_weight: balanced
  
  xgboost:
    n_estimators: 100
    max_depth: 6
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
  
  lightgbm:
    n_estimators: 100
    max_depth: 6
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
    class_weight: balanced
  
  catboost:
    iterations: 100
    depth: 6
    learning_rate: 0.1
    random_seed: 42
    verbose: false

features:
  create_interactions: true
  interaction_pairs: null
  create_polynomial: false
  polynomial_degree: 2
  create_risk_categories: false
  feature_selection: false
  n_features_select: 20

evaluation:
  cv_folds: 5
  scoring_metrics:
    - accuracy
    - precision
    - recall
    - f1
    - roc_auc
  generate_plots: true
  save_plots: true
  plot_format: png
  plot_dpi: 300

explainability:
  use_shap: true
  shap_background_samples: 100
  max_display_features: 20
  generate_plots: true
  save_explanations: true

output_dir: assets
experiment_name: bankruptcy_prediction
save_models: true
save_predictions: true
